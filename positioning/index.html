<!DOCTYPE html>
<html lang="hr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="statico">
        <h1>Statico</h1>
        <p>Questo div ha <code> position: static; </code></p>
    </div>

    <div class="relativo">
        <h1>Relativo</h1>
        <p>Questo div ha <code> position: relative; </code></p>
    </div>

    <div class="assoluto">
        <h1>Assoluto</h1>
        <p>Questo div ha <code> position: absolute; </code></p>
    </div>
    <div class="relativo-genitore">
        <div class="assoluto">
            <h1>Assoluto in relativo</h1>
            <p>Questo div ha <code> position: absolute; </code></p>
        </div>
    </div>



    <div class="fisso">
        <h1>Fisso</h1>
        <p>Questo div ha <code> position: fixed; </code></p>
    </div>

    <div class="alto">
        <div class="sticky">
            <h1>Sticky</h1>
            <p>Questo div ha <code> position: sticky; </code></p>
        </div>
    </div>



</body>

</html>
